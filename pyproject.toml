[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studious"
version = "0.1.0"
description = "A basic Python starter project"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "studious" }]
dependencies = []

[project.scripts]
studious = "studious.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
